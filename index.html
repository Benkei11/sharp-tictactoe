<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharp Tic-Tac-Toe</title>
    <!-- PeerJS library for direct peer-to-peer connection -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .menu, .game-container, .online-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .hidden {
            display: none !important;
        }
        button, input {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #fff;
            color: #000;
        }
        input {
            text-align: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            background: #fff;
            padding: 5px;
            margin-top: 15px;
        }
        .cell {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cell:hover {
            background: #111;
        }
        /* Winning cells highlighted in white */
        .cell.win {
            background: #fff !important;
            color: #000 !important;
        }
        #status {
            margin-top: 10px;
            font-size: 18px;
        }
        #scoreboard {
            font-size: 16px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .action-btns {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .small-btn {
            font-size: 14px;
            padding: 8px 12px;
        }
    </style>
</head>
<body>

    <h1>Sharp XO</h1>

    <!-- Main menu -->
    <div id="mainMenu" class="menu">
        <button onclick="showOnlineMenu()">Online multiplayer</button>
        <button onclick="startLocalGame()">Offline multiplayer</button>
    </div>

    <!-- Online submenu -->
    <div id="onlineMenu" class="online-menu hidden">
        <div style="display: flex; gap: 10px;">
            <input type="text" id="customRoomInput" placeholder="Enter custom room code">
            <button onclick="createCustomGame()">Create room</button>
        </div>
        <div style="margin-top: 10px; display: flex; gap: 10px;">
            <input type="text" id="roomCodeInput" placeholder="Enter room code to join">
            <button onclick="joinGame()">Join room</button>
        </div>
        <button class="small-btn" onclick="backToMain()" style="margin-top: 10px;">Back</button>
    </div>

    <!-- Game interface -->
    <div id="gameContainer" class="game-container hidden">
        <div id="scoreboard">Score - X: 0 | O: 0</div>
        <div id="status">Connecting...</div>
        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        
        <div id="roomInfo" style="margin-top: 10px; font-size: 14px; color: #888; text-align: center;"></div>
        
        <!-- Action buttons -->
        <div class="action-btns">
            <button id="copyBtn" class="small-btn hidden" onclick="copyRoomCode()">Copy code</button>
            <button class="small-btn" onclick="undoMove()">Undo</button>
            <button class="small-btn" onclick="resetGame()">Reset game</button>
            <button class="small-btn" onclick="backToMenu()">Back to menu</button>
        </div>
    </div>

    <script>
        let peer, conn;
        let isHost = false;
        let isOnlineMode = false;
        let mySymbol = 'X';
        let currentTurn = 'X';
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let playerMoves = { 'X': [], 'O': [] };
        let moveHistory = [];
        let scores = { 'X': 0, 'O': 0 };
        let gameOver = false;
        let winningPattern = [];
        let roomCodeText = '';
        let startingPlayer = 'X';

        function showOnlineMenu() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('onlineMenu').classList.remove('hidden');
            isOnlineMode = true;
        }

        function backToMain() {
            document.getElementById('onlineMenu').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
        }

        function startLocalGame() {
            isOnlineMode = false;
            isHost = true;
            mySymbol = 'X';
            scores = { 'X': 0, 'O': 0 };
            startingPlayer = 'X';
            currentTurn = 'X';
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            document.getElementById('roomInfo.innerText = ''');
            document.getElementById('copyBtn').classList.add('hidden');
            updateUI();
        }

        function createCustomGame() {
            const customCode = document.getElementById('customRoomInput').value.trim();
            if (!customCode) {
                alert('Please enter a custom room code');
                return;
            }

            if (peer) {
                peer.destroy();
            }

            roomCodeText = customCode;
            peer = new Peer(roomCodeText);
            isHost = true;
            mySymbol = 'X';
            scores = { 'X': 0, 'O': 0 };
            startingPlayer = 'X';

            peer.on('open', (id) => {
                document.getElementById('onlineMenu').classList.add('hidden');
                document.getElementById('gameContainer').classList.remove('hidden');
                document.getElementById('status').innerText = 'Room created, waiting for player 2...';
                document.getElementById('roomInfo').innerHTML = 'Online multiplayer<br>(' + id + ')';
                document.getElementById('copyBtn').classList.remove('hidden');
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert('This room code is already active. Rejoining as host...');
                    peer.destroy();
                    peer = new Peer();
                    peer.on('open', () => {
                        conn = peer.connect(customCode);
                        setupConnection();
                        document.getElementById('onlineMenu').classList.add('hidden');
                        document.getElementById('gameContainer').classList.remove('hidden');
                        document.getElementById('roomInfo').innerHTML = 'Online multiplayer<br>(' + customCode + ')';
                    });
                } else {
                    alert('Connection error: ' + err.type);
                }
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                document.getElementById('status').innerText = 'Player joined, your turn (X)';
            });
        }

        function joinGame() {
            const roomCode = document.getElementById('roomCodeInput').value.trim();
            if (!roomCode) {
                alert('Please enter a room code to join');
                return;
            }

            if (peer) {
                peer.destroy();
            }

            roomCodeText = roomCode;
            peer = new Peer();
            isHost = false;
            mySymbol = 'O';
            scores = { 'X': 0, 'O': 0 };
            startingPlayer = 'X';

            peer.on('open', () => {
                conn = peer.connect(roomCode);
                setupConnection();
            });

            peer.on('error', (err) => {
                alert('Could not connect to room. Please make sure the room host has created the room first.');
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('onlineMenu').classList.add('hidden');
                document.getElementById('gameContainer').classList.remove('hidden');
                document.getElementById('roomInfo').innerHTML = 'Online multiplayer<br>(' + roomCodeText + ')';
                if (!isHost) {
                    document.getElementById('status').innerText = 'Connected! Player (X) goes first.';
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'move') {
                    applyMove(data.index, data.symbol, false);
                } else if (data.type === 'undo') {
                    undoMoveLocally(false);
                } else if (data.type === 'reset') {
                    resetGameLocally(false);
                }
            });

            conn.on('close', () => {
                document.getElementById('status').innerText = 'Opponent left the room';
            });
        }

        function makeMove(index) {
            if (gameOver || boardState[index] !== "") return;

            if (isOnlineMode) {
                if (currentTurn !== mySymbol) return;
                applyMove(index, mySymbol, true);
                if (conn && conn.open) {
                    conn.send({ type: 'move', index: index, symbol: mySymbol });
                }
            } else {
                applyMove(index, currentTurn, true);
            }
        }

        function applyMove(index, symbol, isLocal) {
            if (boardState[index] !== "") return;

            let removedIndex = null;
            if (playerMoves[symbol].length >= 3) {
                removedIndex = playerMoves[symbol].shift();
                boardState[removedIndex] = "";
            }

            boardState[index] = symbol;
            playerMoves[symbol].push(index);

            moveHistory.push({ index: index, symbol: symbol, removedIndex: removedIndex });

            currentTurn = (symbol === 'X') ? 'O' : 'X';

            updateUI();
            checkWin();
        }

        function undoMove() {
            if (moveHistory.length === 0) return;

            if (isOnlineMode) {
                let lastMove = moveHistory[moveHistory.length - 1];
                if (lastMove.symbol !== mySymbol) return;
            }

            // If game was over, undoing should revert the win state and score increment
            if (gameOver) {
                let lastWinner = boardState[winningPattern[0]];
                if (scores[lastWinner] > 0) scores[lastWinner]--;
                gameOver = false;
                winningPattern = [];
            }

            undoMoveLocally(true);

            if (isOnlineMode && conn && conn.open) {
                conn.send({ type: 'undo' });
            }
        }

        function undoMoveLocally(isLocalAction) {
            if (moveHistory.length === 0) return;

            if (gameOver) {
                let lastWinner = boardState[winningPattern[0]];
                if (scores[lastWinner] > 0) scores[lastWinner]--;
                gameOver = false;
                winningPattern = [];
            }

            let lastMove = moveHistory.pop();
            boardState[lastMove.index] = "";
            playerMoves[lastMove.symbol].pop();

            if (lastMove.removedIndex !== null) {
                boardState[lastMove.removedIndex] = lastMove.symbol;
                playerMoves[lastMove.symbol].unshift(lastMove.removedIndex);
            }

            currentTurn = lastMove.symbol;
            updateUI();
        }

        function updateUI() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.innerText = boardState[i];
                cell.classList.remove('win');
                if (winningPattern.includes(i)) {
                    cell.classList.add('win');
                }
            });

            document.getElementById('scoreboard').innerText = 'Score - X: ' + scores['X'] + ' | O: ' + scores['O'];

            if (gameOver) return;

            if (isOnlineMode) {
                if (currentTurn === mySymbol) {
                    document.getElementById('status').innerText = 'Your turn (' + mySymbol + ')';
                } else {
                    document.getElementById('status').innerText = "Opponent's turn...";
                }
            } else {
                document.getElementById('status').innerText = 'Turn: player ' + currentTurn;
            }
        }

        function checkWin() {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];

            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    let winner = boardState[a];
                    scores[winner]++;
                    winningPattern = [a, b, c];
                    document.getElementById('status').innerText = 'Winner is player ' + winner + '!';
                    document.getElementById('scoreboard').innerText = 'Score - X: ' + scores['X'] + ' | O: ' + scores['O'];
                    gameOver = true;
                    updateUI();
                    return;
                }
            }
        }

        function copyRoomCode() {
            if (roomCodeText) {
                navigator.clipboard.writeText(roomCodeText).then(() => {
                    const copyBtn = document.getElementById('copyBtn');
                    copyBtn.innerText = 'Copied!';
                    setTimeout(() => {
                        copyBtn.innerText = 'Copy code';
                    }, 2000);
                });
            }
        }

        function resetGame() {
            resetGameLocally(true);
            if (isOnlineMode && conn && conn.open) {
                conn.send({ type: 'reset' });
            }
        }

        function resetGameLocally(fullReset) {
            boardState = ["", "", "", "", "", "", "", "", ""];
            playerMoves = { 'X': [], 'O': [] };
            moveHistory = [];
            currentTurn = 'X';
            startingPlayer = 'X';
            gameOver = false;
            winningPattern = [];
            if (fullReset) {
                scores = { 'X': 0, 'O': 0 };
            }
            updateUI();
            if (isOnlineMode) {
                document.getElementById('status').innerText = 'Game reset, your turn (' + mySymbol + ')';
            } else {
                document.getElementById('status').innerText = 'Turn: player X';
            }
        }

        function backToMenu() {
            if (peer) {
                peer.destroy();
            }
            window.location.reload();
        }
    </script>
</body>
</html>
