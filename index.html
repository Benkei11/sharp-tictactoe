<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharp Tic-Tac-Toe</title>
    <!-- Firebase App & Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .menu, .game-container, .online-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .hidden {
            display: none !important;
        }
        button, input {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #fff;
            color: #000;
        }
        input {
            text-align: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            background: #fff;
            padding: 5px;
            margin-top: 15px;
        }
        .cell {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cell:hover {
            background: #111;
        }
        .cell.win {
            background: #fff !important;
            color: #000 !important;
        }
        #status {
            margin-top: 10px;
            font-size: 18px;
        }
        #scoreboard {
            font-size: 16px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .action-btns {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .small-btn {
            font-size: 14px;
            padding: 8px 12px;
        }
    </style>
</head>
<body>

    <h1>Sharp XO</h1>

    <!-- Main Menu -->
    <div id="mainMenu" class="menu">
        <button onclick="showOnlineMenu()">Online multiplayer</button>
        <button onclick="startLocalGame()">Offline multiplayer</button>
    </div>

    <!-- Online Menu -->
    <div id="onlineMenu" class="online-menu hidden">
        <div style="display: flex; gap: 10px;">
            <input type="text" id="customRoomInput" placeholder="Enter room code">
            <button onclick="createCustomGame()">Create room</button>
        </div>
        <div style="margin-top: 10px; display: flex; gap: 10px;">
            <input type="text" id="roomCodeInput" placeholder="Enter room code">
            <button onclick="joinGame()">Join room</button>
        </div>
        <button class="small-btn" onclick="backToMain()" style="margin-top: 10px;">Back</button>
    </div>

    <!-- Game Container -->
    <div id="gameContainer" class="game-container hidden">
        <div id="scoreboard">Score - X: 0 | O: 0</div>
        <div id="status">Connecting...</div>
        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        
        <div id="roomInfo" style="margin-top: 10px; font-size: 14px; color: #888; text-align: center;"></div>
        
        <div class="action-btns">
            <button id="copyBtn" class="small-btn hidden" onclick="copyRoomCode()">Copy code</button>
            <button class="small-btn" onclick="undoMove()">Undo</button>
            <button class="small-btn" onclick="resetGame()">Reset game</button>
            <button class="small-btn" onclick="backToMenu()">Back to menu</button>
        </div>
    </div>

    <script>
        // إعدادات قاعدة البيانات الجديدة الخاصة بمشروعك
        const firebaseConfig = {
            databaseURL: "https://sharp-tictactoe-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentRoomId = '';
        let mySymbol = 'X';
        let isOnlineMode = false;
        let roomRef = null;

        let currentTurn = 'X';
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let playerMoves = { 'X': [], 'O': [] };
        let moveHistory = [];
        let scores = { 'X': 0, 'O': 0 };
        let gameOver = false;
        let winningPattern = [];
        let startingPlayer = 'X';

        function showOnlineMenu() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('onlineMenu').classList.remove('hidden');
            isOnlineMode = true;
        }

        function backToMain() {
            leaveRoomClean();
            document.getElementById('onlineMenu').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
        }

        function startLocalGame() {
            isOnlineMode = false;
            mySymbol = 'X';
            scores = { 'X': 0, 'O': 0 };
            startingPlayer = 'X';
            currentTurn = 'X';
            boardState = ["", "", "", "", "", "", "", "", ""];
            playerMoves = { 'X': [], 'O': [] };
            moveHistory = [];
            gameOver = false;
            winningPattern = [];

            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            document.getElementById('roomInfo').innerText = '';
            document.getElementById('copyBtn').classList.add('hidden');
            updateUI();
        }

        function createCustomGame() {
            const inputField = document.getElementById('customRoomInput');
            const customCode = inputField.value.trim();
            
            if (!customCode) {
                alert('Please enter a room code.');
                return;
            }

            currentRoomId = customCode;
            isOnlineMode = true;
            roomRef = db.ref('rooms/' + currentRoomId);

            roomRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data && data.players && Object.keys(data.players).length > 0) {
                    alert('This code is already in use by active players. Choose another code.');
                    return;
                }

                mySymbol = 'X';
                enterRoomAsPlayer();
            }).catch((error) => {
                alert('Connection error: ' + error.message);
            });
        }

        function joinGame() {
            const inputField = document.getElementById('roomCodeInput');
            const roomCode = inputField.value.trim();
            
            if (!roomCode) {
                alert('Please enter a room code to join.');
                return;
            }

            currentRoomId = roomCode;
            isOnlineMode = true;
            roomRef = db.ref('rooms/' + currentRoomId);

            roomRef.once('value').then((snapshot) => {
                if (!snapshot.exists()) {
                    alert('Room does not exist. Check the code.');
                    return;
                }

                const data = snapshot.val();
                const activePlayersCount = data.players ? Object.keys(data.players).length : 0;

                if (activePlayersCount >= 2) {
                    alert('Room is full (2 players inside). Cannot join.');
                    return;
                }

                if (data.players && data.players.playerX) {
                    mySymbol = 'O';
                } else {
                    mySymbol = 'X';
                }

                enterRoomAsPlayer();
            }).catch((error) => {
                alert('Connection error: ' + error.message);
            });
        }

        function enterRoomAsPlayer() {
            document.getElementById('onlineMenu').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            document.getElementById('roomInfo').innerHTML = 'Online multiplayer<br>(' + currentRoomId + ')';
            document.getElementById('copyBtn').classList.remove('hidden');

            roomRef.once('value').then((snapshot) => {
                if (!snapshot.exists() || !snapshot.val().boardState) {
                    roomRef.set({
                        boardState: ["", "", "", "", "", "", "", "", ""],
                        currentTurn: 'X',
                        scores: { 'X': 0, 'O': 0 },
                        playerMoves: { 'X': [], 'O': [] },
                        moveHistory: [],
                        gameOver: false,
                        winningPattern: [],
                        startingPlayer: 'X',
                        emptySince: null
                    });
                }
                
                if (mySymbol === 'X') {
                    roomRef.child('players/playerX').set(true);
                    roomRef.child('players/playerX').onDisconnect().remove();
                } else {
                    roomRef.child('players/playerO').set(true);
                    roomRef.child('players/playerO').onDisconnect().remove();
                }

                attachRoomListener();
            });
        }

        function leaveRoomClean() {
            if (roomRef && mySymbol) {
                if (mySymbol === 'X') {
                    roomRef.child('players/playerX').remove();
                } else {
                    roomRef.child('players/playerO').remove();
                }
                roomRef.off();
            }
        }

        function attachRoomListener() {
            roomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const players = data.players ? Object.keys(data.players).length : 0;
                if (players === 0) {
                    if (!data.emptySince) {
                        roomRef.update({ emptySince: Date.now() });
                    } else if (Date.now() - data.emptySince > 180000) {
                        roomRef.remove();
                        alert('Room expired and code unlinked due to inactivity.');
                        window.location.reload();
                        return;
                    }
                } else {
                    if (data.emptySince) {
                        roomRef.update({ emptySince: null });
                    }
                }

                boardState = data.boardState || ["", "", "", "", "", "", "", "", ""];
                currentTurn = data.currentTurn || 'X';
                scores = data.scores || { 'X': 0, 'O': 0 };
                playerMoves = data.playerMoves || { 'X': [], 'O': [] };
                moveHistory = data.moveHistory || [];
                gameOver = data.gameOver || false;
                winningPattern = data.winningPattern || [];
                startingPlayer = data.startingPlayer || 'X';

                updateUI();
            });
        }

        function syncStateToFirebase() {
            if (!isOnlineMode || !roomRef) return;
            roomRef.update({
                boardState: boardState,
                currentTurn: currentTurn,
                scores: scores,
                playerMoves: playerMoves,
                moveHistory: moveHistory,
                gameOver: gameOver,
                winningPattern: winningPattern,
                startingPlayer: startingPlayer
            });
        }

        function makeMove(index) {
            if (gameOver || boardState[index] !== "") return;

            if (isOnlineMode) {
                if (currentTurn !== mySymbol) return;
            }

            let symbol = currentTurn;
            let removedIndex = null;
            
            if (playerMoves[symbol].length >= 4) {
                removedIndex = playerMoves[symbol].shift();
                boardState[removedIndex] = "";
            }

            boardState[index] = symbol;
            playerMoves[symbol].push(index);

            moveHistory.push({ index: index, symbol: symbol, removedIndex: removedIndex });

            currentTurn = (symbol === 'X') ? 'O' : 'X';

            checkWin();
            updateUI();

            if (isOnlineMode) {
                syncStateToFirebase();
            }
        }

        function undoMove() {
            if (moveHistory.length === 0) return;

            if (isOnlineMode) {
                let lastMove = moveHistory[moveHistory.length - 1];
                if (lastMove.symbol !== mySymbol) return;
            }

            if (gameOver) {
                let lastWinner = boardState[winningPattern[0]];
                if (scores[lastWinner] > 0) scores[lastWinner]--;
                gameOver = false;
                winningPattern = [];
            }

            let lastMove = moveHistory.pop();
            boardState[lastMove.index] = "";
            playerMoves[lastMove.symbol].pop();

            if (lastMove.removedIndex !== null) {
                boardState[lastMove.removedIndex] = lastMove.symbol;
                playerMoves[lastMove.symbol].unshift(lastMove.removedIndex);
            }

            currentTurn = lastMove.symbol;
            updateUI();

            if (isOnlineMode) {
                syncStateToFirebase();
            }
        }

        function updateUI() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.innerText = boardState[i];
                cell.classList.remove('win');
                if (winningPattern.includes(i)) {
                    cell.classList.add('win');
                }
            });

            document.getElementById('scoreboard').innerText = 'Score - X: ' + scores['X'] + ' | O: ' + scores['O'];

            if (gameOver) return;

            if (isOnlineMode) {
                if (currentTurn === mySymbol) {
                    document.getElementById('status').innerText = 'Your turn (' + mySymbol + ')';
                } else {
                    document.getElementById('status').innerText = "Opponent's turn...";
                }
            } else {
                document.getElementById('status').innerText = 'Turn: player ' + currentTurn;
            }
        }

        function checkWin() {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];

            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    let winner = boardState[a];
                    scores[winner]++;
                    winningPattern = [a, b, c];
                    document.getElementById('status').innerText = 'Winner is player ' + winner + '!';
                    document.getElementById('scoreboard').innerText = 'Score - X: ' + scores['X'] + ' | O: ' + scores['O'];
                    gameOver = true;
                    return;
                }
            }
        }

        function copyRoomCode() {
            if (currentRoomId) {
                navigator.clipboard.writeText(currentRoomId).then(() => {
                    const copyBtn = document.getElementById('copyBtn');
                    copyBtn.innerText = 'Copied!';
                    setTimeout(() => {
                        copyBtn.innerText = 'Copy code';
                    }, 2000);
                });
            }
        }

        function resetGame() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            playerMoves = { 'X': [], 'O': [] };
            moveHistory = [];
            startingPlayer = (startingPlayer === 'X') ? 'O' : 'X';
            currentTurn = startingPlayer;
            gameOver = false;
            winningPattern = [];
            
            updateUI();
            if (isOnlineMode) {
                syncStateToFirebase();
            }
        }

        function backToMenu() {
            leaveRoomClean();
            window.location.reload();
        }
    </script>
</body>
</html>
