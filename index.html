<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharp Tic-Tac-Toe</title>
    <!-- Firebase App & Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .menu, .game-container, .online-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .hidden {
            display: none !important;
        }
        button, input {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 8px 16px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #fff;
            color: #000;
        }
        input {
            text-align: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 85px);
            grid-template-rows: repeat(3, 85px);
            gap: 4px;
            background: #fff;
            padding: 4px;
            margin-top: 8px;
        }
        .cell {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cell:hover {
            background: #111;
        }
        .cell.win {
            background: #fff !important;
            color: #000 !important;
        }
        #status, #spectatorInfo, #viewerCount {
            margin-top: 4px;
            font-size: 15px;
            text-align: center;
        }
        #scoreboard {
            font-size: 14px;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }
        .action-btns {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }
        .small-btn {
            font-size: 12px;
            padding: 5px 10px;
        }
        /* Single Unified Chat Container */
        .chat-box {
            width: 260px;
            border: 1px solid #fff;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: #111;
            border-radius: 4px;
            margin-top: 8px;
        }
        .chat-title {
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #444;
            padding-bottom: 3px;
        }
        .chat-messages {
            height: 80px;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 4px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            text-align: left;
        }
        .chat-input-area {
            display: flex;
            gap: 3px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 4px;
            font-size: 11px;
        }
        .chat-input-area button {
            padding: 4px 6px;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <h1>Sharp XO</h1>

    <!-- Main Menu -->
    <div id="mainMenu" class="menu">
        <button onclick="showOnlineMenu()">Online Multiplayer</button>
        <button onclick="startLocalGame()">Offline Multiplayer</button>
    </div>

    <!-- Online Menu -->
    <div id="onlineMenu" class="online-menu hidden">
        <div style="display: flex; gap: 10px;">
            <input type="text" id="customRoomInput" placeholder="Enter room code">
            <button onclick="createCustomGame()">Create Room</button>
        </div>
        <div style="margin-top: 10px; display: flex; gap: 10px;">
            <input type="text" id="roomCodeInput" placeholder="Enter room code">
            <button onclick="joinGame()">Join Room</button>
        </div>
        <button class="small-btn" onclick="backToMain()" style="margin-top: 10px;">Back</button>
    </div>

    <!-- Game Container -->
    <div id="gameContainer" class="game-container hidden">
        <div id="scoreboard">Score - X: 0 | O: 0</div>
        <div id="viewerCount">Viewers: 0</div>
        <div id="spectatorInfo" class="hidden" style="color: #0ff; font-weight: bold;"></div>
        <div id="status">Connecting...</div>
        
        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        
        <div id="roomInfo" style="margin-top: 4px; font-size: 12px; color: #888; text-align: center;"></div>
        
        <!-- Unified Chat System -->
        <div class="chat-box">
            <div class="chat-title">Game Chat</div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Type a message...">
                <button onclick="sendChatMessage()">Send</button>
            </div>
        </div>

        <div class="action-btns">
            <button id="copyBtn" class="small-btn hidden" onclick="copyRoomCode()">Copy Code</button>
            <button id="undoBtn" class="small-btn" onclick="undoMove()">Undo</button>
            <button id="resetBtn" class="small-btn" onclick="resetGame()">Reset Game</button>
            <button class="small-btn" onclick="backToMenu()">Back to Menu</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://sharp-tictactoe-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentRoomId = '';
        let myRole = 'X'; 
        let mySessionId = 'user_' + Math.random().toString(36).substring(2, 8);
        let isOnlineMode = false;
        let roomRef = null;
        let userPresenceRef = null;

        let currentTurn = 'X';
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let playerMoves = { 'X': [], 'O': [] };
        let moveHistory = [];
        let scores = { 'X': 0, 'O': 0 };
        let gameOver = false;
        let winningPattern = [];
        let startingPlayer = 'X';

        function showOnlineMenu() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('onlineMenu').classList.remove('hidden');
            isOnlineMode = true;
        }

        function backToMain() {
            leaveRoomClean();
            document.getElementById('onlineMenu').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
        }

        function startLocalGame() {
            isOnlineMode = false;
            myRole = 'X';
            scores = { 'X': 0, 'O': 0 };
            startingPlayer = 'X';
            currentTurn = 'X';
            boardState = ["", "", "", "", "", "", "", "", ""];
            playerMoves = { 'X': [], 'O': [] };
            moveHistory = [];
            gameOver = false;
            winningPattern = [];

            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            document.getElementById('roomInfo').innerText = 'Offline Local Mode';
            document.getElementById('copyBtn').classList.add('hidden');
            document.getElementById('viewerCount').classList.add('hidden');
            document.getElementById('spectatorInfo').classList.add('hidden');
            updateUI();
        }

        function createCustomGame() {
            const inputField = document.getElementById('customRoomInput');
            const customCode = inputField.value.trim();
            
            if (!customCode) {
                alert('Please enter a room code.');
                return;
            }

            currentRoomId = customCode;
            isOnlineMode = true;
            roomRef = db.ref('rooms/' + currentRoomId);

            roomRef.once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (data && (data.players || (data.boardState && data.boardState.some(cell => cell !== "")) || data.scores)) {
                        alert('This room code is already in use or contains active game data. You cannot overwrite it.');
                        return;
                    }
                }
                setupRoomAndJoin('X');
            }).catch((error) => {
                alert('Connection error: ' + error.message);
            });
        }

        function joinGame() {
            const inputField = document.getElementById('roomCodeInput');
            const roomCode = inputField.value.trim();
            
            if (!roomCode) {
                alert('Please enter a room code to join.');
                return;
            }

            currentRoomId = roomCode;
            isOnlineMode = true;
            roomRef = db.ref('rooms/' + currentRoomId);

            roomRef.once('value').then((snapshot) => {
                if (!snapshot.exists()) {
                    alert('Room does not exist. Check the code.');
                    return;
                }

                const data = snapshot.val();
                const playersObj = data.players || {};

                if (!playersObj.playerX) {
                    setupRoomAndJoin('X');
                } else if (!playersObj.playerO) {
                    setupRoomAndJoin('O');
                } else {
                    setupRoomAndJoin('Spectator');
                }
            }).catch((error) => {
                alert('Connection error: ' + error.message);
            });
        }

        function setupRoomAndJoin(assignedRole) {
            document.getElementById('onlineMenu').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            document.getElementById('roomInfo').innerHTML = 'Room Code: ' + currentRoomId;
            document.getElementById('copyBtn').classList.remove('hidden');
            document.getElementById('viewerCount').classList.remove('hidden');

            roomRef.transaction((roomData) => {
                if (!roomData) {
                    roomData = {
                        boardState: ["", "", "", "", "", "", "", "", ""],
                        currentTurn: 'X',
                        scores: { 'X': 0, 'O': 0 },
                        playerMoves: { 'X': [], 'O': [] },
                        moveHistory: [],
                        gameOver: false,
                        winningPattern: [],
                        startingPlayer: 'X',
                        players: {},
                        spectators: {}
                    };
                }

                if (!roomData.players) roomData.players = {};
                if (!roomData.spectators) roomData.spectators = {};

                if (assignedRole === 'X' && !roomData.players.playerX) {
                    roomData.players.playerX = mySessionId;
                    myRole = 'X';
                } else if (assignedRole === 'O' && !roomData.players.playerO) {
                    roomData.players.playerO = mySessionId;
                    myRole = 'O';
                } else {
                    roomData.spectators[mySessionId] = true;
                    myRole = 'Spectator';
                }
                return roomData;
            }, (error, committed, snapshot) => {
                if (error) {
                    alert('Error joining room.');
                } else {
                    const data = snapshot.val();
                    if (data.players && data.players.playerX === mySessionId) {
                        myRole = 'X';
                        userPresenceRef = roomRef.child('players/playerX');
                    } else if (data.players && data.players.playerO === mySessionId) {
                        myRole = 'O';
                        userPresenceRef = roomRef.child('players/playerO');
                    } else {
                        myRole = 'Spectator';
                        userPresenceRef = roomRef.child('spectators/' + mySessionId);
                    }

                    userPresenceRef.onDisconnect().remove();
                    attachRoomListener();
                }
            });
        }

        function leaveRoomClean() {
            if (userPresenceRef) {
                userPresenceRef.remove();
                userPresenceRef = null;
            }
            if (roomRef) {
                roomRef.off();
            }
        }

        function attachRoomListener() {
            roomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const players = data.players || {};
                const specs = data.spectators || {};
                const specKeys = Object.keys(specs);

                if (myRole === 'Spectator') {
                    if (!players.playerX && specKeys.length > 0 && specKeys[0] === mySessionId) {
                        roomRef.transaction((currentData) => {
                            if (currentData && currentData.spectators && currentData.spectators[mySessionId] && (!currentData.players || !currentData.players.playerX)) {
                                delete currentData.spectators[mySessionId];
                                if (!currentData.players) currentData.players = {};
                                currentData.players.playerX = mySessionId;
                                return currentData;
                            }
                            return;
                        }, (err, committed, snap) => {
                            if (committed && snap.val() && snap.val().players.playerX === mySessionId) {
                                myRole = 'X';
                                if (userPresenceRef) userPresenceRef.remove();
                                userPresenceRef = roomRef.child('players/playerX');
                                userPresenceRef.onDisconnect().remove();
                            }
                        });
                        return;
                    } else if (!players.playerO && specKeys.length > 0 && specKeys[0] === mySessionId) {
                        roomRef.transaction((currentData) => {
                            if (currentData && currentData.spectators && currentData.spectators[mySessionId] && (!currentData.players || !currentData.players.playerO)) {
                                delete currentData.spectators[mySessionId];
                                if (!currentData.players) currentData.players = {};
                                currentData.players.playerO = mySessionId;
                                return currentData;
                            }
                            return;
                        }, (err, committed, snap) => {
                            if (committed && snap.val() && snap.val().players.playerO === mySessionId) {
                                myRole = 'O';
                                if (userPresenceRef) userPresenceRef.remove();
                                userPresenceRef = roomRef.child('players/playerO');
                                userPresenceRef.onDisconnect().remove();
                            }
                        });
                        return;
                    }
                }

                let mySpecLabel = '';
                if (myRole === 'Spectator') {
                    const index = specKeys.indexOf(mySessionId);
                    if (index !== -1) {
                        mySpecLabel = 'V' + (index + 1);
                    }
                }

                document.getElementById('viewerCount').innerText = `Viewers: ${specKeys.length}`;
                const specInfo = document.getElementById('spectatorInfo');
                if (myRole === 'Spectator') {
                    specInfo.classList.remove('hidden');
                    specInfo.innerText = `You are spectator ${mySpecLabel}`;
                } else {
                    specInfo.classList.add('hidden');
                }

                boardState = data.boardState || ["", "", "", "", "", "", "", "", ""];
                currentTurn = data.currentTurn || 'X';
                scores = data.scores || { 'X': 0, 'O': 0 };
                playerMoves = data.playerMoves || { 'X': [], 'O': [] };
                if (!playerMoves['X']) playerMoves['X'] = [];
                if (!playerMoves['O']) playerMoves['O'] = [];

                moveHistory = data.moveHistory || [];
                gameOver = data.gameOver || false;
                winningPattern = data.winningPattern || [];
                startingPlayer = data.startingPlayer || 'X';

                renderUnifiedChat(data.messages || {}, specKeys);
                updateUI();
            });
        }

        function makeMove(index) {
            if (gameOver || boardState[index] !== "") return;
            if (myRole === 'Spectator') return;

            if (currentTurn !== myRole) return;

            let symbol = currentTurn;
            let removedIndex = null;
            
            if (!playerMoves[symbol]) {
                playerMoves[symbol] = [];
            }

            if (playerMoves[symbol].length >= 4) {
                removedIndex = playerMoves[symbol].shift();
                boardState[removedIndex] = "";
            }

            boardState[index] = symbol;
            playerMoves[symbol].push(index);

            moveHistory.push({ index: index, symbol: symbol, removedIndex: removedIndex });

            currentTurn = (symbol === 'X') ? 'O' : 'X';

            checkWin();
            updateUI();

            roomRef.update({
                boardState: boardState,
                currentTurn: currentTurn,
                scores: scores,
                playerMoves: playerMoves,
                moveHistory: moveHistory,
                gameOver: gameOver,
                winningPattern: winningPattern,
                startingPlayer: startingPlayer
            });
        }

        function undoMove() {
            if (moveHistory.length === 0 || myRole === 'Spectator') return;

            let lastMove = moveHistory[moveHistory.length - 1];
            if (lastMove.symbol !== myRole) return;

            if (gameOver) {
                let lastWinner = boardState[winningPattern[0]];
                if (scores[lastWinner] > 0) scores[lastWinner]--;
                gameOver = false;
                winningPattern = [];
            }

            let lastMovePopped = moveHistory.pop();
            boardState[lastMovePopped.index] = "";
            if (playerMoves[lastMovePopped.symbol]) {
                playerMoves[lastMovePopped.symbol].pop();
            }

            if (lastMovePopped.removedIndex !== null) {
                boardState[lastMovePopped.removedIndex] = lastMovePopped.symbol;
                if (!playerMoves[lastMovePopped.symbol]) playerMoves[lastMovePopped.symbol] = [];
                playerMoves[lastMovePopped.symbol].unshift(lastMovePopped.removedIndex);
            }

            currentTurn = lastMovePopped.symbol;
            updateUI();

            roomRef.update({
                boardState: boardState,
                currentTurn: currentTurn,
                scores: scores,
                playerMoves: playerMoves,
                moveHistory: moveHistory,
                gameOver: gameOver,
                winningPattern: winningPattern,
                startingPlayer: startingPlayer
            });
        }

        function updateUI() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.innerText = boardState[i];
                cell.classList.remove('win');
                if (winningPattern.includes(i)) {
                    cell.classList.add('win');
                }
            });

            document.getElementById('scoreboard').innerText = `Score - X: ${scores['X']} | O: ${scores['O']}`;

            if (gameOver) return;

            if (myRole === 'Spectator') {
                document.getElementById('status').innerText = `Turn: Player ${currentTurn}'s turn`;
            } else {
                if (currentTurn === myRole) {
                    document.getElementById('status').innerText = `Your turn (${myRole})`;
                } else {
                    document.getElementById('status').innerText = `Opponent's turn (${currentTurn})...`;
                }
            }
        }

        function checkWin() {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];

            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    let winner = boardState[a];
                    scores[winner]++;
                    winningPattern = [a, b, c];
                    document.getElementById('status').innerText = `Winner is Player ${winner}!`;
                    document.getElementById('scoreboard').innerText = `Score - X: ${scores['X']} | O: ${scores['O']}`;
                    gameOver = true;
                    return;
                }
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            roomRef.once('value').then((snapshot) => {
                const data = snapshot.val() || {};
                const players = data.players || {};
                const specKeys = Object.keys(data.spectators || {});
                let senderLabel = '';

                if (players.playerX === mySessionId) {
                    senderLabel = 'Player X';
                } else if (players.playerO === mySessionId) {
                    senderLabel = 'Player O';
                } else {
                    const index = specKeys.indexOf(mySessionId);
                    senderLabel = index !== -1 ? `V${index + 1}` : 'Viewer';
                }

                const msgRef = roomRef.child('messages').push();
                msgRef.set({
                    sender: senderLabel,
                    text: text,
                    timestamp: Date.now()
                });
                input.value = '';
            });
        }

        function renderUnifiedChat(messagesObj, specKeys) {
            const chatContainer = document.getElementById('chatMessages');
            chatContainer.innerHTML = '';
            
            const keys = Object.keys(messagesObj);
            keys.sort((a, b) => messagesObj[a].timestamp - messagesObj[b].timestamp);

            keys.forEach(key => {
                const msg = messagesObj[key];
                const div = document.createElement('div');
                div.innerHTML = `<strong>${msg.sender}:</strong> ${msg.text}`;
                chatContainer.appendChild(div);
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function copyRoomCode() {
            if (currentRoomId) {
                navigator.clipboard.writeText(currentRoomId).then(() => {
                    const copyBtn = document.getElementById('copyBtn');
                    copyBtn.innerText = 'Copied!';
                    setTimeout(() => {
                        copyBtn.innerText = 'Copy Code';
                    }, 2000);
                });
            }
        }

    function resetGame() {
            if (myRole === 'Spectator') return;
            
            boardState = ["", "", "", "", "", "", "", "", ""];
            playerMoves = { 'X': [], 'O': [] };
            moveHistory = [];
            startingPlayer = (startingPlayer === 'X') ? 'O' : 'X';
            currentTurn = startingPlayer;
            gameOver = false;
            winningPattern = [];
            
            updateUI();
            roomRef.update({
                boardState: boardState,
                currentTurn: currentTurn,
                scores: scores,
                playerMoves: playerMoves,
                moveHistory: moveHistory,
                gameOver: gameOver,
                winningPattern: winningPattern,
                startingPlayer: startingPlayer
            });
        }

        function backToMenu() {
            leaveRoomClean();
            window.location.reload();
        }
    </script>
</body>
</html>
