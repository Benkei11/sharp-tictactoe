<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sharp XO">
    <title>Sharp Tic Tac Toe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 15px;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin: auto;
        }

        h1 {
            font-size: 22px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px solid #ffffff;
            padding-bottom: 4px;
        }

        .score-board {
            display: flex;
            width: 100%;
            justify-content: space-between;
            border: 2px solid #ffffff;
            padding: 10px;
            background-color: #000000;
        }

        .player-box {
            text-align: center;
            flex: 1;
            padding: 5px 0;
            transition: all 0.2s;
        }

        .player-box.active {
            background-color: #ffffff;
            color: #000000;
        }

        .player-name {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .score {
            font-size: 22px;
            font-weight: bold;
        }

        .status-msg {
            height: 35px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            color: #ffffff;
            border: 1px solid #ffffff;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #111111;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            width: 100%;
            aspect-ratio: 1;
            background-color: #ffffff;
            border: 3px solid #ffffff;
        }

        .cell {
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 900;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .cell:active {
            background-color: #222222;
        }

        .cell.fading {
            opacity: 0.3;
            border: 2px dashed #ffffff;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        button {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            flex: 1;
            border-radius: 0px;
        }

        button:active {
            background-color: #ffffff;
            color: #000000;
        }

        button:disabled {
            border-color: #333333;
            color: #333333;
            background-color: #000000;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Tic Tac Toe</h1>

    <div class="score-board">
        <div class="player-box" id="p1-box">
            <div class="player-name">PLAYER ONE (X)</div>
            <div class="score" id="score-x">0</div>
        </div>
        <div style="border-left: 2px solid #fff; margin: 0 8px;"></div>
        <div class="player-box" id="p2-box">
            <div class="player-name">PLAYER TWO (O)</div>
            <div class="score" id="score-o">0</div>
        </div>
    </div>

    <div class="status-msg" id="status">دور Player One</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <div class="controls">
        <div class="btn-group">
            <button id="undo-btn">تراجع (Undo)</button>
            <button id="clear-btn">مسح البورد</button>
        </div>
        <button id="reset-score-btn">تصفير النتيجة</button>
    </div>
</div>

<script>
    let boardState = Array(9).fill('');
    let currentPlayer = 'X';
    let xMoves = [];
    let oMoves = [];
    let history = [];
    let scoreX = 0;
    let scoreO = 0;
    let isGameOver = false;

    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('status');
    const scoreXElem = document.getElementById('score-x');
    const scoreOElem = document.getElementById('score-o');
    const p1Box = document.getElementById('p1-box');
    const p2Box = document.getElementById('p2-box');
    const undoBtn = document.getElementById('undo-btn');

    const winPatterns = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
    ];

    function initGame() {
        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        document.getElementById('clear-btn').addEventListener('click', clearBoard);
        document.getElementById('reset-score-btn').addEventListener('click', resetScores);
        undoBtn.addEventListener('click', undoLastMove);
        updateUI();
    }

    function handleCellClick(e) {
        const index = parseInt(e.target.dataset.index);

        if (boardState[index] !== '' || isGameOver) return;

        saveHistory();

        const currentMoves = currentPlayer === 'X' ? xMoves : oMoves;

        if (currentMoves.length === 3) {
            const removedIndex = currentMoves.shift();
            boardState[removedIndex] = '';
        }

        boardState[index] = currentPlayer;
        currentMoves.push(index);

        if (checkWin()) {
            isGameOver = true;
            if (currentPlayer === 'X') {
                scoreX++;
                statusText.innerText = '🎉 فاز PLAYER ONE!';
            } else {
                scoreO++;
                statusText.innerText = '🎉 فاز PLAYER TWO!';
            }
            updateScores();
        } else {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusText.innerText = `دور Player ${currentPlayer === 'X' ? 'One' : 'Two'}`;
        }

        updateUI();
    }

    function checkWin() {
        return winPatterns.some(pattern => {
            return pattern.every(index => boardState[index] === currentPlayer);
        });
    }

    function saveHistory() {
        history.push({
            boardState: [...boardState],
            xMoves: [...xMoves],
            oMoves: [...oMoves],
            currentPlayer: currentPlayer,
            isGameOver: isGameOver
        });
    }

    function undoLastMove() {
        if (history.length === 0) return;

        const lastState = history.pop();
        boardState = lastState.boardState;
        xMoves = lastState.xMoves;
        oMoves = lastState.oMoves;
        currentPlayer = lastState.currentPlayer;
        isGameOver = lastState.isGameOver;

        statusText.innerText = `دور Player ${currentPlayer === 'X' ? 'One' : 'Two'}`;
        updateUI();
    }

    function clearBoard() {
        boardState = Array(9).fill('');
        xMoves = [];
        oMoves = [];
        history = [];
        currentPlayer = 'X';
        isGameOver = false;
        statusText.innerText = 'دور Player One';
        updateUI();
    }

    function resetScores() {
        scoreX = 0;
        scoreO = 0;
        updateScores();
        clearBoard();
    }

    function updateScores() {
        scoreXElem.innerText = scoreX;
        scoreOElem.innerText = scoreO;
    }

    function updateUI() {
        const xFadeIndex = xMoves.length === 3 ? xMoves[0] : null;
        const oFadeIndex = oMoves.length === 3 ? oMoves[0] : null;

        cells.forEach((cell, index) => {
            cell.innerText = boardState[index];
            cell.classList.remove('fading');

            if (index === xFadeIndex || index === oFadeIndex) {
                cell.classList.add('fading');
            }
        });

        if (currentPlayer === 'X' && !isGameOver) {
            p1Box.classList.add('active');
            p2Box.classList.remove('active');
        } else if (currentPlayer === 'O' && !isGameOver) {
            p2Box.classList.add('active');
            p1Box.classList.remove('active');
        } else {
            p1Box.classList.remove('active');
            p2Box.classList.remove('active');
        }

        undoBtn.disabled = history.length === 0;
    }

    initGame();
</script>

</body>
</html>
