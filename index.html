<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharp XO Game Edition</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        h1 {
            letter-spacing: 2px;
            margin: 15px 0;
            border-bottom: 2px solid #fff;
            padding-bottom: 5px;
            font-size: 24px;
        }
        .scoreboard {
            display: flex;
            width: 100%;
            max-width: 350px;
            margin-bottom: 15px;
            border: 2px solid #fff;
        }
        .player-box {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #000;
            color: #fff;
        }
        .player-box:first-child {
            border-left: 2px solid #fff;
        }
        .player-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .player-score {
            font-size: 20px;
            font-weight: bold;
        }
        .turn-indicator {
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            width: 100%;
            max-width: 350px;
            border: 2px solid #fff;
            margin-bottom: 15px;
        }
        .cell {
            aspect-ratio: 1;
            background-color: #000;
            border: 1px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            user-select: none;
        }
        /* Winning cells highlight: Pure White background with Black text */
        .cell.winner {
            background-color: #fff;
            color: #000;
        }
        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 10px;
        }
        button.btn {
            flex: 1;
            padding: 12px;
            background-color: #000;
            color: #fff;
            border: 2px solid #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button.btn:active {
            background-color: #fff;
            color: #000;
        }
        .reset-score-btn {
            width: 100%;
            max-width: 350px;
            padding: 12px;
            background-color: #000;
            color: #fff;
            border: 2px solid #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>TIC TAC TOE</h1>

    <div class="scoreboard">
        <div class="player-box">
            <div class="player-title">PLAYER TWO (O)</div>
            <div class="player-score" id="scoreO">0</div>
        </div>
        <div class="player-box">
            <div class="player-title">PLAYER ONE (X)</div>
            <div class="player-score" id="scoreX">0</div>
        </div>
    </div>

    <div class="turn-indicator" id="turnIndicator">Player One's Turn (X)</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="resetBoard()">Clear Board</button>
        <button class="btn" onclick="undoMove()">Undo</button>
    </div>
    <button class="reset-score-btn" onclick="resetScore()">Reset Score</button>

    <script>
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let isGameActive = true;
        let scoreX = 0;
        let scoreO = 0;
        let history = [];

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        const cells = document.querySelectorAll('.cell');
        const turnIndicator = document.getElementById('turnIndicator');
        const scoreXEl = document.getElementById('scoreX');
        const scoreOEl = document.getElementById('scoreO');

        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        function handleCellClick(e) {
            const index = e.target.dataset.index;

            if (board[index] !== '' || !isGameActive) return;

            history.push({
                board: [...board],
                currentPlayer: currentPlayer,
                isGameActive: isGameActive,
                scoreX: scoreX,
                scoreO: scoreO,
                turnText: turnIndicator.textContent
            });

            board[index] = currentPlayer;
            e.target.textContent = currentPlayer;

            checkResult();
        }

        function checkResult() {
            let roundWon = false;
            let winningCombination = [];

            for (let condition of winningConditions) {
                let a = board[condition[0]];
                let b = board[condition[1]];
                let c = board[condition[2]];

                if (a === '' || b === '' || c === '') continue;
                if (a === b && b === c) {
                    roundWon = true;
                    winningCombination = condition;
                    break;
                }
            }

            if (roundWon) {
                isGameActive = false;
                if (currentPlayer === 'X') {
                    scoreX++;
                    scoreXEl.textContent = scoreX;
                    turnIndicator.textContent = "Player One (X) Wins!";
                } else {
                    scoreO++;
                    scoreOEl.textContent = scoreO;
                    turnIndicator.textContent = "Player Two (O) Wins!";
                }

                winningCombination.forEach(index => {
                    cells[index].classList.add('winner');
                });
                return;
            }

            if (!board.includes('')) {
                isGameActive = false;
                turnIndicator.textContent = "Draw!";
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            turnIndicator.textContent = currentPlayer === 'X' ? "Player One's Turn (X)" : "Player Two's Turn (O)";
        }

    function undoMove() {
        if (history.length === 0) return;

        let previousState = history.pop();
        board = previousState.board;
        currentPlayer = previousState.currentPlayer;
        isGameActive = previousState.isGameActive;
        scoreX = previousState.scoreX;
        scoreO = previousState.scoreO;

        scoreXEl.textContent = scoreX;
        scoreOEl.textContent = scoreO;

        cells.forEach((cell, index) => {
            cell.textContent = board[index];
            cell.classList.remove('winner');
        });

        turnIndicator.textContent = previousState.turnText;
    }

        function resetBoard() {
            board = ['', '', '', '', '', '', '', '', ''];
            isGameActive = true;
            currentPlayer = 'X';
            history = [];
            turnIndicator.textContent = "Player One's Turn (X)";
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('winner');
            });
        }

        function resetScore() {
            scoreX = 0;
            scoreO = 0;
            scoreXEl.textContent = '0';
            scoreOEl.textContent = '0';
            resetBoard();
        }
    </script>
</body>
</html>
