<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharp Tic-Tac-Toe Online</title>
    <!-- PeerJS library for direct peer-to-peer connection -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .menu, .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .hidden {
            display: none !important;
        }
        button, input {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #fff;
            color: #000;
        }
        input {
            text-align: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            background: #fff;
            padding: 5px;
            margin-top: 20px;
        }
        .cell {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cell:hover {
            background: #111;
        }
        #status {
            margin-top: 15px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>SHARP XO</h1>

    <!-- Main menu for creating or joining a room -->
    <div id="menu" class="menu">
        <button onclick="createGame()">Create New Room</button>
        <div style="margin-top: 10px;">
            <input type="text" id="roomCodeInput" placeholder="Enter Room Code">
            <button onclick="joinGame()">Join Room</button>
        </div>
    </div>

    <!-- Game interface -->
    <div id="gameContainer" class="game-container hidden">
        <div id="status">Connecting...</div>
        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        <div id="roomInfo" style="margin-top: 15px; font-size: 14px; color: #888;"></div>
    </div>

    <script>
        let peer, conn;
        let isHost = false;
        let mySymbol = '';
        let currentTurn = 'X';
        let boardState = ["", "", "", "", "", "", "", "", ""];
        // FIFO limit rule: Maximum 3 markers per player
        let playerMoves = { 'X': [], 'O': [] };

        function createGame() {
            peer = new Peer();
            isHost = true;
            mySymbol = 'X';

            peer.on('open', (id) => {
                document.getElementById('menu').classList.add('hidden');
                document.getElementById('gameContainer').classList.remove('hidden');
                document.getElementById('status').innerText = 'Room created! Waiting for player 2...';
                document.getElementById('roomInfo').innerText = 'Room Code: ' + id;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                document.getElementById('status').innerText = 'Player joined! Your turn (X)';
            });
        }

        function joinGame() {
            const roomCode = document.getElementById('roomCodeInput').value.trim();
            if (!roomCode) {
                alert('Please enter a room code');
                return;
            }

            peer = new Peer();
            isHost = false;
            mySymbol = 'O';

            peer.on('open', () => {
                conn = peer.connect(roomCode);
                setupConnection();
                document.getElementById('menu').classList.add('hidden');
                document.getElementById('gameContainer').classList.remove('hidden');
                document.getElementById('status').innerText = 'Connected! Player (X) goes first.';
            });
        }

        function setupConnection() {
            conn.on('data', (data) => {
                if (data.type === 'move') {
                    applyMove(data.index, data.symbol, false);
                }
            });
        }

        function makeMove(index) {
            if (boardState[index] !== "" || currentTurn !== mySymbol) return;

            applyMove(index, mySymbol, true);

            if (conn && conn.open) {
                conn.send({ type: 'move', index: index, symbol: mySymbol });
            }
        }

        function applyMove(index, symbol, isLocal) {
            if (playerMoves[symbol].length >= 3) {
                let oldestIndex = playerMoves[symbol].shift();
                boardState[oldestIndex] = "";
            }

            boardState[index] = symbol;
            playerMoves[symbol].push(index);

            currentTurn = (symbol === 'X') ? 'O' : 'X';

            updateUI();
            checkWin();
        }

        function updateUI() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.innerText = boardState[i];
            });

            if (currentTurn === mySymbol) {
                document.getElementById('status').innerText = 'Your turn (' + mySymbol + ')';
            } else {
                document.getElementById('status').innerText = "Opponent's turn...";
            }
        }

        function checkWin() {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];

            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    document.getElementById('status').innerText = 'Winner: Player ' + boardState[a] + '! 🎉';
                    currentTurn = '';
                    return;
                }
            }
        }
    </script>
</body>
</html>
