<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharp Tic-Tac-Toe</title>
    <!-- Firebase App & Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .menu, .game-container, .online-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .hidden {
            display: none !important;
        }
        button, input {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 8px 16px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #fff;
            color: #000;
        }
        input {
            text-align: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 85px);
            grid-template-rows: repeat(3, 85px);
            gap: 4px;
            background: #fff;
            padding: 4px;
            margin-top: 8px;
        }
        .cell {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cell:hover {
            background: #111;
        }
        .cell.win {
            background: #fff !important;
            color: #000 !important;
        }
        #status, #roomCounts {
            margin-top: 4px;
            font-size: 15px;
            text-align: center;
        }
        #scoreboard {
            font-size: 14px;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }
        .action-btns {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }
        .small-btn {
            font-size: 12px;
            padding: 5px 10px;
        }
        .chat-box {
            width: 260px;
            border: 1px solid #fff;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: #111;
            border-radius: 4px;
            margin-top: 8px;
        }
        .chat-title {
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #444;
            padding-bottom: 3px;
        }
        .chat-messages {
            height: 80px;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 4px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            text-align: left;
        }
        .chat-input-area {
            display: flex;
            gap: 3px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 4px;
            font-size: 11px;
        }
        .chat-input-area button {
            padding: 4px 6px;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <h1>Sharp xo</h1>

    <!-- Main Menu -->
    <div id="mainMenu" class="menu">
        <button onclick="showOnlineMenu()">Online multiplayer</button>
        <button onclick="startLocalGame()">Offline multiplayer</button>
    </div>

    <!-- Online Menu -->
    <div id="onlineMenu" class="online-menu hidden">
        <div style="display: flex; gap: 10px;">
            <input type="text" id="customRoomInput" placeholder="Enter room code">
            <button onclick="createCustomGame()">Create room</button>
        </div>
        <div style="margin-top: 10px; display: flex; gap: 10px;">
            <input type="text" id="roomCodeInput" placeholder="Enter room code">
            <button onclick="joinGame()">Join room</button>
        </div>
        <button class="small-btn" onclick="backToMain()" style="margin-top: 10px;">Back</button>
    </div>

    <!-- Game Container -->
    <div id="gameContainer" class="game-container hidden">
        <div id="scoreboard">Score - X: 0 | O: 0</div>
        <div id="roomCounts">Players: 0/2</div>
        <div id="status">Connecting...</div>
        
        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        
        <div id="roomInfo" style="margin-top: 4px; font-size: 12px; color: #888; text-align: center;"></div>
        
        <!-- Chat System -->
        <div id="chatBoxContainer" class="chat-box">
            <div class="chat-title">Game chat</div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Type a message...">
                <button onclick="sendChatMessage()">Send</button>
            </div>
        </div>

        <div class="action-btns">
            <button id="copyBtn" class="small-btn hidden" onclick="copyRoomCode()">Copy code</button>
            <button id="resetBtn" class="small-btn" onclick="resetGame()">Reset game</button>
            <button class="small-btn" onclick="backToMenu()">Back to menu</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://sharp-tictactoe-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentRoomId = '';
        let myRole = ''; 
        let mySessionId = localStorage.getItem('xo_session_id');
        if (!mySessionId) {
            mySessionId = 'user_' + Math.random().toString(36).substring(2, 10);
            localStorage.setItem('xo_session_id', mySessionId);
        }

        let isOnlineMode = false;
        let roomRef = null;
        let userPresenceRef = null;

        let currentTurn = 'X';
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let scores = { 'X': 0, 'O': 0 };
        let gameOver = false;
        let winningPattern = [];
        let startingPlayer = 'X';

        function showOnlineMenu() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('onlineMenu').classList.remove('hidden');
            isOnlineMode = true;
        }

        function backToMain() {
            leaveRoomClean();
            document.getElementById('onlineMenu').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
        }

        function startLocalGame() {
            isOnlineMode = false;
            myRole = 'X';
            scores = { 'X': 0, 'O': 0 };
            startingPlayer = 'X';
            currentTurn = 'X';
            boardState = ["", "", "", "", "", "", "", "", ""];
            gameOver = false;
            winningPattern = [];

            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            document.getElementById('roomInfo').innerText = '';
            document.getElementById('copyBtn').classList.add('hidden');
            document.getElementById('roomCounts').classList.add('hidden');
            document.getElementById('chatBoxContainer').classList.add('hidden');
            updateUI();
        }

        function createCustomGame() {
            const inputField = document.getElementById('customRoomInput');
            const customCode = inputField.value.trim();
            
            if (!customCode) {
                alert('Enter room code.');
                return;
            }

            currentRoomId = customCode;
            isOnlineMode = true;
            roomRef = db.ref('rooms/' + currentRoomId);

            roomRef.once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (data && data.players && (data.players.playerX || data.players.playerO)) {
                        alert('Room in use.');
                        return;
                    }
                }
                setupRoomAndJoin();
            }).catch((error) => {
                alert('Connection error.');
            });
        }

        function joinGame() {
            const inputField = document.getElementById('roomCodeInput');
            const roomCode = inputField.value.trim();
            
            if (!roomCode) {
                alert('Enter room code.');
                return;
            }

            currentRoomId = roomCode;
            isOnlineMode = true;
            roomRef = db.ref('rooms/' + currentRoomId);

            roomRef.once('value').then((snapshot) => {
                if (!snapshot.exists()) {
                    alert('Room not found.');
                    return;
                }
                const data = snapshot.val();
                const players = data.players || {};
                
                if (players.playerX && players.playerO && players.playerX !== mySessionId && players.playerO !== mySessionId) {
                    alert('Room is full (2/2 players).');
                    return;
                }
                setupRoomAndJoin();
            }).catch((error) => {
                alert('Connection error.');
            });
        }

        function setupRoomAndJoin() {
            document.getElementById('onlineMenu').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            document.getElementById('roomInfo').innerHTML = 'Room code: ' + currentRoomId;
            document.getElementById('copyBtn').classList.remove('hidden');
            document.getElementById('roomCounts').classList.remove('hidden');
            document.getElementById('chatBoxContainer').classList.remove('hidden');

            roomRef.transaction((roomData) => {
                if (!roomData) {
                    roomData = {
                        boardState: ["", "", "", "", "", "", "", "", ""],
                        currentTurn: 'X',
                        scores: { 'X': 0, 'O': 0 },
                        gameOver: false,
                        winningPattern: [],
                        startingPlayer: 'X',
                        players: {}
                    };
                }

                if (!roomData.players) roomData.players = {};

                if (roomData.players.playerX === mySessionId) {
                    // مسموح له بالعودة
                } else if (roomData.players.playerO === mySessionId) {
                    // مسموح له بالعودة
                } else if (!roomData.players.playerX) {
                    roomData.players.playerX = mySessionId;
                } else if (!roomData.players.playerO) {
                    roomData.players.playerO = mySessionId;
                }

                return roomData;
            }, (error, committed, snapshot) => {
                if (error || !committed) {
                    alert('Error joining room.');
                    backToMain();
                    return;
                }

                const data = snapshot.val();
                const players = data.players || {};

                if (players.playerX === mySessionId) {
                    myRole = 'X';
                    userPresenceRef = roomRef.child('players/playerX');
                } else if (players.playerO === mySessionId) {
                    myRole = 'O';
                    userPresenceRef = roomRef.child('players/playerO');
                } else {
                    alert('Room is full.');
                    backToMain();
                    return;
                }

                userPresenceRef.onDisconnect().remove();
                attachRoomListener();
            });
        }

        function leaveRoomClean() {
            if (userPresenceRef) {
                userPresenceRef.remove();
                userPresenceRef = null;
            }
            if (roomRef) {
                roomRef.off();
            }
        }

        function attachRoomListener() {
            roomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const players = data.players || {};
                
                if (players.playerX === mySessionId) {
                    myRole = 'X';
                } else if (players.playerO === mySessionId) {
                    myRole = 'O';
                }

                let activePlayersCount = 0;
                if (players.playerX) activePlayersCount++;
                if (players.playerO) activePlayersCount++;

                document.getElementById('roomCounts').innerText = `Players: ${activePlayersCount}/2`;

                boardState = data.boardState || ["", "", "", "", "", "", "", "", ""];
                currentTurn = data.currentTurn || 'X';
                scores = data.scores || { 'X': 0, 'O': 0 };
                gameOver = data.gameOver || false;
                winningPattern = data.winningPattern || [];
                startingPlayer = data.startingPlayer || 'X';

                renderUnifiedChat(data.messages || {});
                updateUI();
            });
        }

        function makeMove(index) {
            if (gameOver || boardState[index] !== "") return;
            
            if (isOnlineMode) {
                if (currentTurn !== myRole) return;
            }

            let symbol = currentTurn;
            boardState[index] = symbol;

            currentTurn = (symbol === 'X') ? 'O' : 'X';

            checkWin();
            updateUI();

            if (isOnlineMode) {
                roomRef.update({
                    boardState: boardState,
                    currentTurn: currentTurn,
                    scores: scores,
                    gameOver: gameOver,
                    winningPattern: winningPattern,
                    startingPlayer: startingPlayer
                });
            }
        }

        function updateUI() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.innerText = boardState[i];
                cell.classList.remove('win');
                if (winningPattern.includes(i)) {
                    cell.classList.add('win');
                }
            });

            document.getElementById('scoreboard').innerText = `Score - X: ${scores['X']} | O: ${scores['O']}`;

            if (gameOver) return;

            if (isOnlineMode) {
                if (currentTurn === myRole) {
                    document.getElementById('status').innerText = `Your turn (${myRole})`;
                } else {
                    document.getElementById('status').innerText = `Opponent's turn (${currentTurn})...`;
                }
            } else {
                document.getElementById('status').innerText = `Turn: player ${currentTurn}`;
            }
        }

        function checkWin() {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];

            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    let winner = boardState[a];
                    scores[winner]++;
                    winningPattern = [a, b, c];
                    document.getElementById('status').innerText = `Winner is player ${winner}!`;
                    document.getElementById('scoreboard').innerText = `Score - X: ${scores['X']} | O: ${scores['O']}`;
                    gameOver = true;
                    return;
                }
            }

            // فحص التعادل إذا كانت اللوحة ممتلئة ولا يوجد فائز
            if (!boardState.includes("")) {
                document.getElementById('status').innerText = `It's a draw!`;
                gameOver = true;
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !isOnlineMode) return;

            roomRef.once('value').then((snapshot) => {
                const data = snapshot.val() || {};
                const players = data.players || {};
                let senderLabel = (players.playerX === mySessionId) ? 'Player X' : 'Player O';

                const msgRef = roomRef.child('messages').push();
                msgRef.set({
                    sender: senderLabel,
                    text: text,
                    timestamp: Date.now()
                });
                input.value = '';
            });
        }

        function renderUnifiedChat(messagesObj) {
            const chatContainer = document.getElementById('chatMessages');
            chatContainer.innerHTML = '';
            
            const keys = Object.keys(messagesObj);
            keys.sort((a, b) => messagesObj[a].timestamp - messagesObj[b].timestamp);

            keys.forEach(key => {
                const msg = messagesObj[key];
                const div = document.createElement('div');
                div.innerHTML = `<strong>${msg.sender}:</strong> ${msg.text}`;
                chatContainer.appendChild(div);
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function copyRoomCode() {
            if (currentRoomId) {
                navigator.clipboard.writeText(currentRoomId).then(() => {
                    const copyBtn = document.getElementById('copyBtn');
                    copyBtn.innerText = 'Copied!';
                    setTimeout(() => {
                        copyBtn.innerText = 'Copy code';
                    }, 2000);
                });
            }
        }

        function resetGame() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            startingPlayer = (startingPlayer === 'X') ? 'O' : 'X';
            currentTurn = startingPlayer;
            gameOver = false;
            winningPattern = [];
            
            updateUI();
            if (isOnlineMode) {
                roomRef.update({
                    boardState: boardState,
                    currentTurn: currentTurn,
                    scores: scores,
                    gameOver: gameOver,
                    winningPattern: winningPattern,
                    startingPlayer: startingPlayer
                });
            }
        }

        function backToMenu() {
            leaveRoomClean();
            window.location.reload();
        }
    </script>
</body>
</html>
