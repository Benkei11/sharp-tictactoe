<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharp Tic-Tac-Toe</title>
    <!-- PeerJS library for direct peer-to-peer connection -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .menu, .game-container, .online-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .hidden {
            display: none !important;
        }
        button, input {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #fff;
            color: #000;
        }
        input {
            text-align: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            background: #fff;
            padding: 5px;
            margin-top: 20px;
        }
        .cell {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cell:hover {
            background: #111;
        }
        #status {
            margin-top: 15px;
            font-size: 18px;
        }
        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .small-btn {
            font-size: 14px;
            padding: 8px 15px;
        }
    </style>
</head>
<body>

    <h1>Sharp XO</h1>

    <!-- Main menu -->
    <div id="mainMenu" class="menu">
        <button onclick="showOnlineMenu()">Online multiplayer</button>
        <button onclick="startLocalGame()">Local play (pass & play)</button>
    </div>

    <!-- Online submenu -->
    <div id="onlineMenu" class="online-menu hidden">
        <div style="display: flex; gap: 10px;">
            <input type="text" id="customRoomInput" placeholder="Enter custom room code">
            <button onclick="createCustomGame()">Create room</button>
        </div>
        <div style="margin-top: 10px; display: flex; gap: 10px;">
            <input type="text" id="roomCodeInput" placeholder="Enter room code to join">
            <button onclick="joinGame()">Join room</button>
        </div>
        <button class="small-btn" onclick="backToMain()" style="margin-top: 10px;">Back</button>
    </div>

    <!-- Game interface -->
    <div id="gameContainer" class="game-container hidden">
        <div id="status">Connecting...</div>
        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        
        <div id="roomInfo" style="margin-top: 15px; font-size: 14px; color: #888;"></div>
        
        <!-- Action buttons -->
        <div class="action-btns">
            <button id="copyBtn" class="small-btn hidden" onclick="copyRoomCode()">Copy code</button>
            <button class="small-btn" onclick="resetGame()">Reset game</button>
            <button class="small-btn" onclick="backToMenu()">Back to menu</button>
        </div>
    </div>

    <script>
        let peer, conn;
        let isHost = false;
        let isOnlineMode = false;
        let mySymbol = 'X';
        let currentTurn = 'X';
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let playerMoves = { 'X': [], 'O': [] };
        let gameOver = false;
        let roomCodeText = '';

        function showOnlineMenu() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('onlineMenu').classList.remove('hidden');
            isOnlineMode = true;
        }

        function backToMain() {
            document.getElementById('onlineMenu').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
        }

        function startLocalGame() {
            isOnlineMode = false;
            isHost = true;
            mySymbol = 'X';
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            document.getElementById('status').innerText = 'Turn: player X';
            document.getElementById('roomInfo').innerText = 'Local pass & play mode';
        }

        function createCustomGame() {
            const customCode = document.getElementById('customRoomInput').value.trim();
            if (!customCode) {
                alert('Please enter a custom room code');
                return;
            }

            if (peer) {
                peer.destroy();
            }

            roomCodeText = customCode;
            peer = new Peer(roomCodeText);
            isHost = true;
            mySymbol = 'X';

            peer.on('open', (id) => {
                document.getElementById('onlineMenu').classList.add('hidden');
                document.getElementById('gameContainer').classList.remove('hidden');
                document.getElementById('status').innerText = 'Room created, waiting for player 2...';
                document.getElementById('roomInfo').innerText = 'Room code: ' + id;
                document.getElementById('copyBtn').classList.remove('hidden');
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert('This room code is already taken or active. Try another one.');
                } else {
                    alert('Connection error: ' + err.type);
                }
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                document.getElementById('status').innerText = 'Player joined, your turn (X)';
            });
        }

        function joinGame() {
            const roomCode = document.getElementById('roomCodeInput').value.trim();
            if (!roomCode) {
                alert('Please enter a room code to join');
                return;
            }

            if (peer) {
                peer.destroy();
            }

            peer = new Peer();
            isHost = false;
            mySymbol = 'O';

            peer.on('open', () => {
                conn = peer.connect(roomCode);
                setupConnection();
                document.getElementById('status').innerText = 'Connected, player (X) goes first.';
            });

            peer.on('error', (err) => {
                alert('Could not connect to room. Check the code.');
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                if (!isHost) {
                    document.getElementById('onlineMenu').classList.add('hidden');
                    document.getElementById('gameContainer').classList.remove('hidden');
                    document.getElementById('roomInfo').innerText = 'Connected to room successfully';
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'move') {
                    applyMove(data.index, data.symbol, false);
                } else if (data.type === 'reset') {
                    resetGameLocally();
                }
            });

            conn.on('close', () => {
                document.getElementById('status').innerText = 'Opponent left the room';
            });
        }

        function makeMove(index) {
            if (gameOver || boardState[index] !== "") return;

            if (isOnlineMode) {
                if (currentTurn !== mySymbol) return;
                applyMove(index, mySymbol, true);
                if (conn && conn.open) {
                    conn.send({ type: 'move', index: index, symbol: mySymbol });
                }
            } else {
                applyMove(index, currentTurn, true);
            }
        }

        function applyMove(index, symbol, isLocal) {
            if (boardState[index] !== "") return;

            if (playerMoves[symbol].length >= 3) {
                let oldestIndex = playerMoves[symbol].shift();
                boardState[oldestIndex] = "";
            }

            boardState[index] = symbol;
            playerMoves[symbol].push(index);

            currentTurn = (symbol === 'X') ? 'O' : 'X';

            updateUI();
            checkWin();
        }

        function updateUI() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.innerText = boardState[i];
            });

            if (gameOver) return;

            if (isOnlineMode) {
                if (currentTurn === mySymbol) {
                    document.getElementById('status').innerText = 'Your turn (' + mySymbol + ')';
                } else {
                    document.getElementById('status').innerText = "Opponent's turn...";
                }
            } else {
                document.getElementById('status').innerText = 'Turn: player ' + currentTurn;
            }
        }

        function checkWin() {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];

            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    document.getElementById('status').innerText = 'Winner is player ' + boardState[a] + '!';
                    gameOver = true;
                    return;
                }
            }
        }

        function copyRoomCode() {
            if (roomCodeText) {
                navigator.clipboard.writeText(roomCodeText).then(() => {
                    const copyBtn = document.getElementById('copyBtn');
                    copyBtn.innerText = 'Copied!';
                    setTimeout(() => {
                        copyBtn.innerText = 'Copy code';
                    }, 2000);
                });
            }
        }

        function resetGame() {
            resetGameLocally();
            if (isOnlineMode && conn && conn.open) {
                conn.send({ type: 'reset' });
            }
        }

        function resetGameLocally() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            playerMoves = { 'X': [], 'O': [] };
            currentTurn = 'X';
            gameOver = false;
            updateUI();
            if (isOnlineMode) {
                document.getElementById('status').innerText = 'Game reset, your turn (' + mySymbol + ')';
            } else {
                document.getElementById('status').innerText = 'Turn: player X';
            }
        }

        function backToMenu() {
            if (peer) {
                peer.destroy();
            }
            window.location.reload();
        }
    </script>
</body>
</html>
